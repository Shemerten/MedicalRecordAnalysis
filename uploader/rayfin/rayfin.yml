id: pdf-data-uploader
name: PDF Data Uploader
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
  data:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: true
    path: rayfin/functions
    auth:
      type: application
    buildCommand: npm run build
